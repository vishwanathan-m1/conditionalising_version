plugins:
  # - awesome-pages
  # - tags
  - search
#  - meta-descriptions
  - minify:
      minify_html: true      
      minify_js: true
      minify_css: true
      htmlmin_opts:
          remove_comments: true
      cache_safe: true
  - include-markdown
  - macros
  - section-index
  - mike:
      canonical_version: latest
      alias_type: redirect

nav:
- Home: index.md

- Module-1: 
  - Topic1-Overview: Module-1/topic1.md
  - Topic2-Overview: Module-1/topic2.md

- Module-2: 
  - Topic1-Overview: Module-2/topic1.md
  - Topic2-Overview: Module-2/topic2.md
  - Topic3-Overview: Module-2/topic3.md

- Module-3: 
  - File1-Overview: Module-2/file1.md
  - File2-Overview: Module-2/file2.md
