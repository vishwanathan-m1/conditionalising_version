site_name: Conditionalising Versioned Documentation
site_description: >
  Conditionalising Versioned Documentation
# site_url: https://opensource.hcltechsw.com/DW-doc/latest/
site_url: http://127.0.0.1:8000/cv-doc/latest/
use_directory_urls: false
docs_dir: source
# site_dir: docs


theme:
  name: material
  features:
  - content.code.select
  # - navigation.tabs
  - navigation.indexes
  - navigation.sections
  - navigation.top
  - navigation.instant
  - search.highlight
  - search.share
  - search.suggest
  # - navigation.prune
  # custom_dir: theme_overrides
  icon:
    repo: fontawesome/brands/github
    logo: fontawesome/regular/home    
  font:
    text: Roboto
    code: Roboto Mono
  static_templates:
  - 404.html
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- md_in_html
- toc:
    title: On this page
- attr_list
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Copyright
copyright: >-
  Copyright &copy; 2019-2026, HCLSoftware.

